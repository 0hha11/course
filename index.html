<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandas Training Camp</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #2c3e50; }
        .code-editor { border: 1px solid #ddd; padding: 20px; margin: 20px auto; max-width: 600px; }
        textarea { width: 100%; height: 150px; font-family: monospace; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        #output { background: #f8f9fa; padding: 10px; text-align: left; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🐼 Pandas Data Analysis Training</h1>
    <p>Run pandas code directly in your browser</p>
    
    <div class="code-editor">
        <textarea id="code">import pandas as pd
data = {'Name': ['Alice', 'Bob', 'Charlie'], 'Age': [25, 30, 35]}
df = pd.DataFrame(data)
print(df)</textarea>
        <br>
        <button onclick="runCode()">Run Code</button>
        <button onclick="resetCode()">Reset</button>
        <div id="output"></div>
        <div id="loading" style="display:none">Loading...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <script>
        let pyodide;
        async function init() {
            document.getElementById('loading').style.display = 'block';
            pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
            await pyodide.loadPackage(['pandas', 'numpy']);
            document.getElementById('loading').style.display = 'none';
        }
        async function runCode() {
            if (!pyodide) await init();
            const code = document.getElementById('code').value;
            const output = document.getElementById('output');
            try {
                output.textContent = 'Running...';
                const result = await pyodide.runPythonAsync(code);
                const stdout = pyodide.runPython("import sys; sys.stdout.getvalue()");
                output.textContent = stdout || result;
            } catch (e) {
                output.textContent = 'Error: ' + e.message;
            }
        }
        function resetCode() {
            document.getElementById('code').value = "import pandas as pd\ndata = {'Name': ['Alice', 'Bob', 'Charlie'], 'Age': [25, 30, 35]}\ndf = pd.DataFrame(data)\nprint(df)";
            document.getElementById('output').textContent = '';
        }
    </script>
</body>
</html>
